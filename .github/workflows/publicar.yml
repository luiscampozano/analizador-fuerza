# 1) "verificar": en CUALQUIER rama o pull request revisa sintaxis, versión, caché y pruebas del servidor.
# 2) "publicar": solo en main, y solo si "verificar" pasó, publica en Cloudflare Pages (proyecto "fuerzapro").
# Necesita dos secretos del repositorio: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
# Mientras no existan, la publicación se salta sin fallar.
name: Publicar en Cloudflare

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Si algo falla aquí, NO se publica (la versión anterior sigue en línea).
      - name: Verificar antes de publicar
        run: bash pruebas/verificar.sh

  publicar:
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Avisar si faltan los secretos
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Faltan los secretos CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID; no se publica."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      - name: Preparar archivos del sitio
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          mkdir -p dist
          rsync -a ./ dist/ --exclude .git --exclude .github --exclude dist --exclude sql \
            --exclude README.md --exclude .gitignore --exclude .nojekyll \
            --exclude pruebas --exclude docs --exclude HANDOFF.md --exclude CLAUDE.md
          ls dist

      - name: Publicar en Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fuerzapro --branch=main --commit-dirty=true
